name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tipos, pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Tipos (mypy)
        run: mypy app tests
      - name: Pruebas y cobertura (mínimo 80 %)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  migrations:
    name: Migraciones sobre PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecoumb
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ecoumb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecoumb" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ecoumb:ci-only-password@localhost:5432/ecoumb
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: upgrade head
        run: alembic upgrade head
      - name: "Sin deriva entre modelo y migración"
        run: alembic check
      - name: "Seed (dos veces, debe ser idempotente)"
        run: python -m app.seed && python -m app.seed
      - name: downgrade base (debe revertir sin errores)
        run: alembic downgrade base
      - name: upgrade head otra vez
        run: alembic upgrade head

  frontend:
    name: Frontend (lint, tipos, pruebas, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
